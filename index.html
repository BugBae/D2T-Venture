<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="D2T Venture — Create. Connect. Inspire.">
    <title>D2T Venture | Welcome</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating Background -->
    <div class="particles" aria-hidden="true">
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>•</span>
        <span>✧</span>
        <span>✦</span>
        <span>•</span>
        <span>✧</span>
    </div>

    <!-- Welcome Screen -->
    <main class="welcome-screen" id="welcomeScreen">

        <div class="welcome-card">

            <p class="mini-title">WELCOME TO</p>

            <h1>D2T <span>VENTURE</span></h1>

            <div class="gold-line"></div>

            <p class="welcome-text">
                A space where ideas become experiences,
                creativity meets purpose, and every step
                is designed to make an impact.
            </p>

            <form id="entryForm">

                <div class="input-box">
                    <input
                        type="text"
                        id="userName"
                        placeholder=" "
                        autocomplete="name"
                        required
                    >
                    <label for="userName">Your Name</label>
                </div>

                <div class="input-box">
                    <input
                        type="email"
                        id="userEmail"
                        placeholder=" "
                        autocomplete="email"
                        required
                    >
                    <label for="userEmail">Your Email</label>
                </div>

                <button type="submit" class="lets-go">
                    <span>LET'S GO</span>
                    <span class="arrow">→</span>
                </button>

            </form>

            <p class="privacy-note">
                Enter your details to step into the D2T experience.
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
